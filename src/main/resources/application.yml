spring:
  application:
    name: ai-pr-review

  # ==================== AI 配置 (DeepSeek + Embedding) ====================
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:YOUR-API-KEY}       # DeepSeek API 密钥，通过环境变量注入
      base-url: https://api.deepseek.com                             # DeepSeek 兼容 OpenAI 接口格式
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}                     # deepseek-chat (V3) 或 deepseek-reasoner (R1)
          temperature: 0.3                                            # 较低的温度确保输出更一致、更少"幻觉"

      # ---------- Embedding 向量化配置 (硅基流动) ----------
      embedding:
        api-key: ${SILICONFLOW_API_KEY:YOUR-API-KEY}       # 硅基流动 API 密钥，通过环境变量注入
        base-url: https://api.siliconflow.cn
        options:
          model: ${EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}

  # ==================== Milvus 向量数据库配置 (本地 Docker Standalone) ====================
  vectorstore:
    milvus:
      database-name: ${MILVUS_DATABASE:default}
      collection-name: ${MILVUS_COLLECTION:team_conventions}
      embedding-dimension: 1024
      metric-type: COSINE
      index-type: AUTOINDEX
      initialize-schema: true
      # Milvus Standalone 本地连接 (Docker Desktop)
      uri: ${MILVUS_URI:http://localhost:19530}
      # token: 本地部署无需认证


# ==================== GitHub 配置 ====================
github:
  token: ${GITHUB_TOKEN:YOUR-KEY}                   # GitHub Personal Access Token，通过环境变量注入
  api:
    base-url: https://api.github.com                              # GitHub API 基础地址

# ==================== 服务器配置 ====================
server:
  port: 8080
